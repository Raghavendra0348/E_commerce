name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public
      JWT_SECRET: ci-only-access-signing-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-signing-secret-not-for-production
      RAZORPAY_KEY_ID: rzp_test_ci_fixture
      RAZORPAY_KEY_SECRET: ci-only-payment-secret
      RAZORPAY_WEBHOOK_SECRET: ci-only-webhook-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: Backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: Backend
        run: npx prisma migrate deploy

      - name: Run ESLint
        working-directory: Backend
        run: npm run lint

      - name: Run Vitest Unit & Integration Suite
        working-directory: Backend
        run: npm test

  frontend-build-test:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: Frontend
        run: npm test

      - name: Build Production Assets
        working-directory: Frontend
        run: npm run build
